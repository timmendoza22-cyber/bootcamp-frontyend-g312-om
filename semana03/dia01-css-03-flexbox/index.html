<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Flexbox</title>
    <style>
        .contendor {
            width: 300px;
            height: 300px;
            background-color: lightblue;
            display: flex;
            flex-direction: row; /* Cambiar a column para ver el efecto */
            gap: 20px; /* Espacio entre los elementos flexibles */
            justify-content: center; /* Alineación horizontal */
            justify-content: space-between;
            justify-content: space-around;        
        }
        .box {
            width: 50px;
            height: 50px;
            background-color: lightcoral;
            text-align: center;
            padding: 5px;
        }
</head>
<body>
    <div class="contendor">
        <!-- div.box*3 -->
        <div class="box">A</div>
        <div class="box">B</div>
        <div class="box">C</div>
    </div>
</body>
</html>
